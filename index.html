<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JokingCe Style — Customer Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #C9A84C;
      --light-gold: #E8C97A;
      --pale-gold: #FDF6E3;
      --black: #1A1208;
      --warm-gray: #4A3F2F;
      --muted: #8A7A60;
      --border: #E8DFC8;
      --bg: #FEFCF7;
      --success-bg: #E5F5EA;
      --success: #2B7E47;
      --pending-bg: #FFF4D8;
      --pending: #9C6D00;
      --completed-bg: #ECE8E0;
      --danger: #A32626;
      --shadow: 0 12px 28px rgba(26, 18, 8, 0.08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      color: var(--warm-gray);
      background: var(--bg);
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--black);
      border-bottom: 1px solid #2a1d12;
      padding: 14px 20px 16px;
    }

    .brand {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
    }

    .logo {
      margin: 0;
      color: var(--gold);
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      line-height: 1;
      font-weight: 700;
    }

    .subtitle {
      margin: 4px 0 0;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 0.8rem;
    }

    .tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tab-btn {
      border: 1px solid var(--light-gold);
      border-radius: 999px;
      padding: 8px 16px;
      font-weight: 600;
      cursor: pointer;
      background: transparent;
      color: #fff;
    }

    .tab-btn.active {
      background: var(--gold);
      color: #fff;
      border-color: var(--gold);
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .metric-card {
      background: #fff;
      border: 1px solid var(--border);
      border-left: 5px solid var(--gold);
      border-radius: 12px;
      padding: 12px;
      box-shadow: var(--shadow);
    }

    .metric-card .label {
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .metric-card .value {
      font-family: 'Cormorant Garamond', serif;
      color: var(--gold);
      font-size: 2rem;
      font-weight: 700;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    input, select, textarea, button { font: inherit; }
    input, select, textarea {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      background: #fff;
      color: var(--warm-gray);
      width: 100%;
    }

    .toolbar input, .toolbar select { min-width: 220px; max-width: 280px; }

    .btn-primary {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      background: var(--gold);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-outline {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      background: #fff;
      color: var(--warm-gray);
      font-weight: 500;
      cursor: pointer;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th, td {
      text-align: left;
      border-bottom: 1px solid var(--border);
      padding: 12px 10px;
      font-size: 0.92rem;
      vertical-align: top;
    }

    tbody tr:hover { background: var(--pale-gold); }

    .customer-cell {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--light-gold);
      color: var(--black);
      font-size: 0.8rem;
      font-weight: 700;
    }

    .status {
      border-radius: 999px;
      display: inline-block;
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .status-active { background: var(--success-bg); color: var(--success); }
    .status-pending { background: var(--pending-bg); color: var(--pending); }
    .status-completed { background: var(--completed-bg); color: #6a6a6a; }

    .actions { display: flex; gap: 8px; }

    .action-btn {
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      color: var(--warm-gray);
      padding: 4px 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.8rem;
    }

    .action-btn:hover { border-color: var(--gold); }
    .action-btn.del:hover { border-color: var(--danger); color: var(--danger); }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 12px;
    }

    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-left: 5px solid var(--gold);
      border-radius: 12px;
      padding: 12px;
      box-shadow: var(--shadow);
    }

    .card h4 {
      margin: 0;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      color: var(--black);
    }

    .card p { margin: 7px 0 0; font-size: 0.9rem; }
    .balance-due { color: var(--danger); font-weight: 600; }
    .balance-paid { color: var(--success); font-weight: 600; }

    .measure-grid {
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .tile {
      background: var(--pale-gold);
      border-radius: 8px;
      padding: 8px;
      text-align: center;
    }

    .tile .k { font-size: 0.75rem; color: var(--muted); }
    .tile .v { margin-top: 3px; font-weight: 600; }

    .hidden { display: none !important; }

    .empty {
      border: 1px dashed var(--border);
      border-radius: 12px;
      background: #fff;
      padding: 28px;
      text-align: center;
      color: var(--muted);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(26, 18, 8, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .modal {
      background: #fff;
      border: 1px solid var(--border);
      border-top: 6px solid var(--gold);
      border-radius: 14px;
      width: min(880px, 100%);
      max-height: 92vh;
      overflow: auto;
      padding: 16px;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .modal h3 {
      margin: 0;
      font-family: 'Cormorant Garamond', serif;
      color: var(--gold);
      font-size: 1.9rem;
    }

    .x-btn {
      border: 1px solid var(--border);
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      font-size: 1.2rem;
      color: var(--warm-gray);
    }

    .grid-2 {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }

    fieldset {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin: 0 0 12px;
    }

    legend {
      color: var(--muted);
      padding: 0 4px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="brand">
      <div>
        <h1 class="logo">JokingCe Style</h1>
        <p class="subtitle">Customer Management</p>
      </div>
      <nav class="tabs">
        <button class="tab-btn active" data-tab="customers">Customers</button>
        <button class="tab-btn" data-tab="orders">Orders</button>
        <button class="tab-btn" data-tab="measurements">Measurements</button>
      </nav>
    </div>
  </header>

  <main>
    <section id="stats" class="stats-grid"></section>

    <section id="customersView" class="view">
      <div class="toolbar">
        <input id="searchInput" type="text" placeholder="Search name, phone, service" />
        <select id="statusFilter">
          <option value="all">All</option>
          <option value="Active">Active</option>
          <option value="Pending">Pending Pickup</option>
          <option value="Completed">Completed</option>
        </select>
        <button id="addCustomerBtn" class="btn-primary">+ Add Customer</button>
      </div>
      <div id="customersTable"></div>
    </section>

    <section id="ordersView" class="view hidden">
      <div id="ordersCards" class="cards"></div>
    </section>

    <section id="measurementsView" class="view hidden">
      <div id="measureCards" class="cards"></div>
    </section>
  </main>

  <div id="modalBackdrop" class="modal-backdrop">
    <div class="modal">
      <div class="modal-head">
        <h3 id="modalTitle">Add Customer</h3>
        <button type="button" id="closeModalBtn" class="x-btn">×</button>
      </div>
      <form id="customerForm">
        <input type="hidden" id="customerId" />

        <fieldset>
          <legend>Customer Details</legend>
          <div class="grid-2">
            <label>Full Name <input id="name" required /></label>
            <label>Phone <input id="phone" required /></label>
            <label>Service Type
              <select id="service" required>
                <option value="">Select service</option>
                <option>Dress Sewing</option>
                <option>Kente Outfit</option>
                <option>Suit Tailoring</option>
                <option>Blouse & Skirt</option>
                <option>Wedding Gown</option>
                <option>Alteration</option>
                <option>Traditional Attire</option>
                <option>Corporate Wear</option>
              </select>
            </label>
            <label>Due Date <input id="due" type="date" /></label>
            <label>Amount (GH₵) <input id="amount" type="number" step="0.01" min="0" /></label>
            <label>Deposit Paid (GH₵) <input id="deposit" type="number" step="0.01" min="0" /></label>
            <label>Status
              <select id="status">
                <option>Active</option>
                <option>Pending</option>
                <option>Completed</option>
              </select>
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Measurements (cm)</legend>
          <div class="grid-2">
            <label>Bust <input id="bust" type="number" step="0.1" min="0" /></label>
            <label>Waist <input id="waist" type="number" step="0.1" min="0" /></label>
            <label>Hips <input id="hips" type="number" step="0.1" min="0" /></label>
            <label>Length <input id="length" type="number" step="0.1" min="0" /></label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Notes</legend>
          <textarea id="notes" rows="4" placeholder="Special instructions..."></textarea>
        </fieldset>

        <div class="footer">
          <button type="button" id="cancelBtn" class="btn-outline">Cancel</button>
          <button type="submit" class="btn-primary" id="saveBtn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const el = id => document.getElementById(id);
    const formatMoney = n => `GH₵ ${Number(n || 0).toFixed(2)}`;
    const plus14Days = () => {
      const d = new Date();
      d.setDate(d.getDate() + 14);
      return d.toISOString().slice(0, 10);
    };

    let customers = [
      { id: 1, name: 'Akosua Mensah', phone: '+233 24 112 2233', service: 'Wedding Gown', due: '2026-04-20', amount: 2200, deposit: 900, status: 'Active', bust: 92, waist: 74, hips: 102, length: 158, notes: 'Beaded sleeves and detachable train.' },
      { id: 2, name: 'Esi Owusu', phone: '+233 54 331 7744', service: 'Kente Outfit', due: '2026-04-16', amount: 1300, deposit: 1300, status: 'Completed', bust: 88, waist: 70, hips: 97, length: 145, notes: 'Matching head wrap with neat finish.' },
      { id: 3, name: 'Ama Boateng', phone: '+233 27 992 4500', service: 'Blouse & Skirt', due: '2026-04-13', amount: 780, deposit: 300, status: 'Pending', bust: 95, waist: 80, hips: 108, length: 112, notes: 'Allow extra ease around hips.' },
      { id: 4, name: 'Adwoa Asante', phone: '+233 20 555 6601', service: 'Corporate Wear', due: '2026-04-22', amount: 980, deposit: 500, status: 'Active', bust: 90, waist: 76, hips: 100, length: 140, notes: 'Two-piece office set in charcoal.' },
      { id: 5, name: 'Naa Dedei Quaye', phone: '+233 26 809 4481', service: 'Dress Sewing', due: '2026-04-19', amount: 860, deposit: 450, status: 'Active', bust: 86, waist: 68, hips: 94, length: 136, notes: 'Simple flare silhouette, no slit.' }
    ];

    const views = ['customers', 'orders', 'measurements'];

    const initials = name => name.split(' ').slice(0, 2).map(part => part[0] || '').join('').toUpperCase();

    const badge = status => {
      const cls = status === 'Active' ? 'status-active' : status === 'Pending' ? 'status-pending' : 'status-completed';
      const label = status === 'Pending' ? 'Pending Pickup' : status;
      return `<span class="status ${cls}">${label}</span>`;
    };

    function renderStats() {
      const stats = [
        ['Total Customers', customers.length],
        ['Active Orders', customers.filter(c => c.status === 'Active').length],
        ['Pending Pickup', customers.filter(c => c.status === 'Pending').length],
        ['Completed', customers.filter(c => c.status === 'Completed').length]
      ];
      el('stats').innerHTML = stats.map(([label, value]) => `
        <article class="metric-card">
          <div class="label">${label}</div>
          <div class="value">${value}</div>
        </article>
      `).join('');
    }

    function renderCustomers() {
      const q = el('searchInput').value.trim().toLowerCase();
      const statusFilter = el('statusFilter').value;
      const list = customers.filter(c => {
        const matchesSearch = !q || `${c.name} ${c.phone} ${c.service}`.toLowerCase().includes(q);
        const matchesStatus = statusFilter === 'all' || c.status === statusFilter;
        return matchesSearch && matchesStatus;
      });

      if (!list.length) {
        el('customersTable').innerHTML = '<div class="empty">No customers match your filters.</div>';
        return;
      }

      el('customersTable').innerHTML = `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Customer</th><th>Phone</th><th>Service</th><th>Due Date</th><th>Amount</th><th>Status</th><th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${list.map(c => {
                const balance = Number(c.amount || 0) - Number(c.deposit || 0);
                return `
                  <tr>
                    <td><div class="customer-cell"><span class="avatar">${initials(c.name)}</span><span>${c.name}</span></div></td>
                    <td>${c.phone}</td>
                    <td>${c.service}</td>
                    <td>${c.due || '-'}</td>
                    <td>${formatMoney(c.amount)}<br><small>Balance: ${formatMoney(balance)}</small></td>
                    <td>${badge(c.status)}</td>
                    <td>
                      <div class="actions">
                        <button class="action-btn" data-action="edit" data-id="${c.id}">Edit</button>
                        <button class="action-btn" data-action="view" data-id="${c.id}">View</button>
                        <button class="action-btn del" data-action="del" data-id="${c.id}">Del</button>
                      </div>
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderOrders() {
      if (!customers.length) {
        el('ordersCards').innerHTML = '<div class="empty">No orders available.</div>';
        return;
      }
      el('ordersCards').innerHTML = customers.map(c => {
        const balance = Number(c.amount || 0) - Number(c.deposit || 0);
        return `
          <article class="card">
            <h4>${c.name}</h4>
            <p><strong>${c.service}</strong></p>
            <p>Due Date: ${c.due || '-'}</p>
            <p>Total Amount: ${formatMoney(c.amount)}</p>
            <p class="${balance > 0 ? 'balance-due' : 'balance-paid'}">Balance: ${formatMoney(balance)}</p>
            <p>${badge(c.status)}</p>
          </article>
        `;
      }).join('');
    }

    function renderMeasurements() {
      const list = customers.filter(c => [c.bust, c.waist, c.hips, c.length].some(v => Number(v) > 0));
      if (!list.length) {
        el('measureCards').innerHTML = '<div class="empty">No measurement records yet.</div>';
        return;
      }
      el('measureCards').innerHTML = list.map(c => `
        <article class="card">
          <h4>${c.name}</h4>
          <p>${c.service}</p>
          <div class="measure-grid">
            <div class="tile"><div class="k">Bust</div><div class="v">${c.bust || '-'} cm</div></div>
            <div class="tile"><div class="k">Waist</div><div class="v">${c.waist || '-'} cm</div></div>
            <div class="tile"><div class="k">Hips</div><div class="v">${c.hips || '-'} cm</div></div>
            <div class="tile"><div class="k">Length</div><div class="v">${c.length || '-'} cm</div></div>
          </div>
          ${c.notes ? `<p><strong>Notes:</strong> ${c.notes}</p>` : ''}
        </article>
      `).join('');
    }

    function renderAll() {
      renderStats();
      renderCustomers();
      renderOrders();
      renderMeasurements();
    }

    function openModal(customer = null) {
      el('customerForm').reset();
      el('customerId').value = customer?.id || '';
      el('modalTitle').textContent = customer ? 'Edit Customer' : 'Add Customer';
      el('saveBtn').textContent = customer ? 'Update' : 'Save';
      el('due').value = customer?.due || plus14Days();
      if (customer) {
        ['name', 'phone', 'service', 'due', 'amount', 'deposit', 'status', 'bust', 'waist', 'hips', 'length', 'notes'].forEach(k => {
          el(k).value = customer[k] ?? '';
        });
      } else {
        el('status').value = 'Active';
      }
      el('modalBackdrop').style.display = 'flex';
    }

    function closeModal() {
      el('modalBackdrop').style.display = 'none';
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const target = btn.dataset.tab;
        views.forEach(view => el(`${view}View`).classList.toggle('hidden', view !== target));
      });
    });

    el('searchInput').addEventListener('input', renderCustomers);
    el('statusFilter').addEventListener('change', renderCustomers);
    el('addCustomerBtn').addEventListener('click', () => openModal());
    el('cancelBtn').addEventListener('click', closeModal);
    el('closeModalBtn').addEventListener('click', closeModal);
    el('modalBackdrop').addEventListener('click', e => {
      if (e.target.id === 'modalBackdrop') closeModal();
    });

    el('customerForm').addEventListener('submit', e => {
      e.preventDefault();
      const name = el('name').value.trim();
      const phone = el('phone').value.trim();
      const service = el('service').value.trim();
      if (!name || !phone || !service) {
        alert('Name, Phone, and Service are required.');
        return;
      }

      const payload = {
        id: Number(el('customerId').value) || Date.now(),
        name,
        phone,
        service,
        due: el('due').value || plus14Days(),
        amount: Number(el('amount').value || 0),
        deposit: Number(el('deposit').value || 0),
        status: el('status').value,
        bust: Number(el('bust').value || 0),
        waist: Number(el('waist').value || 0),
        hips: Number(el('hips').value || 0),
        length: Number(el('length').value || 0),
        notes: el('notes').value.trim()
      };

      const i = customers.findIndex(c => c.id === payload.id);
      if (i >= 0) customers[i] = payload;
      else customers.unshift(payload);

      closeModal();
      renderAll();
    });

    document.addEventListener('click', e => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const id = Number(btn.dataset.id);
      const customer = customers.find(c => c.id === id);
      if (!customer) return;

      if (btn.dataset.action === 'edit') openModal(customer);
      if (btn.dataset.action === 'view') {
        const balance = Number(customer.amount || 0) - Number(customer.deposit || 0);
        alert(`${customer.name}\nPhone: ${customer.phone}\nService: ${customer.service}\nDue: ${customer.due}\nAmount: ${formatMoney(customer.amount)}\nBalance: ${formatMoney(balance)}\nStatus: ${customer.status}`);
      }
      if (btn.dataset.action === 'del' && confirm(`Delete ${customer.name}?`)) {
        customers = customers.filter(c => c.id !== id);
        renderAll();
      }
    });

    renderAll();
  </script>
</body>
</html>
